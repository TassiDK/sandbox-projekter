<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hype-Træet 🌳</title>
  <meta name="description" content="En interaktiv karriere tracker – dine kompetencer og bedrifter som et voksende træ." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark-mode">

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span>🌳</span>
        <span class="logo-text">Hype-Træet</span>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" title="Skift tema">☀️</button>
        <button id="share-btn"   class="btn-icon" title="Del">↗</button>
      </div>
    </div>
  </header>

  <main class="main-layout">

    <aside class="profile-panel">
      <div class="profile-avatar" id="profile-avatar">🧑‍💻</div>
      <h1  class="profile-name"   id="profile-name">…</h1>
      <p   class="profile-title"  id="profile-title">…</p>
      <p   class="profile-tagline" id="profile-tagline">…</p>
      <div class="profile-stats"  id="profile-stats"></div>
      <div class="legend">
        <p class="legend-title">Kategorier</p>
        <div id="legend-items"></div>
      </div>
    </aside>

    <section class="tree-section">
      <div class="tree-container" id="tree-container">
        <!-- SVG stamme + grene -->
        <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <!-- HTML blade injiceres her via JS -->
      </div>
      <p class="tree-hint">Hover = preview &nbsp;·&nbsp; Klik på blad = detaljer &nbsp;·&nbsp; Klik på gren = fokus</p>
    </section>

  </main>

  <!-- Tooltip -->
  <div class="tooltip" id="tooltip">
    <div class="tooltip-title"  id="tt-title"></div>
    <div class="tooltip-desc"   id="tt-desc"></div>
    <div class="tooltip-stars"  id="tt-stars"></div>
    <div class="tooltip-hint">Klik for fuld detaljevisning</div>
  </div>

  <!-- Leaf detail modal -->
  <div class="modal-overlay" id="leaf-modal">
    <div class="leaf-modal">
      <button class="modal-close" id="lm-close">✕</button>
      <div class="lm-banner" id="lm-banner">
        <span class="lm-icon"     id="lm-icon"></span>
        <div  class="lm-meta">
          <span class="lm-category" id="lm-category"></span>
          <span class="lm-date"     id="lm-date"></span>
        </div>
        <div class="lm-dots" id="lm-dots"></div>
      </div>
      <div class="lm-body">
        <h2  class="lm-title" id="lm-title"></h2>
        <p   class="lm-from"  id="lm-from"></p>
        <p   class="lm-desc"  id="lm-desc"></p>
        <hr  class="lm-divider" />
        <div class="lm-tags"  id="lm-tags"></div>
        <div class="lm-level-row">
          <span class="lm-level-label">Niveau</span>
          <div  class="lm-bar"><div class="lm-fill" id="lm-fill"></div></div>
          <span class="lm-num" id="lm-num"></span>
        </div>
        <a class="lm-link hidden" id="lm-link" href="#" target="_blank" rel="noopener">↗ Åbn eksternt link</a>
      </div>
    </div>
  </div>

  <!-- Share modal -->
  <div class="modal-overlay" id="share-modal">
    <div class="share-modal">
      <button class="modal-close" id="share-close">✕</button>
      <h2>Del dit Hype-Træ 🌳</h2>
      <p>Vis verden hvad du er lavet af!</p>
      <div class="share-buttons">
        <a class="share-btn linkedin" id="share-linkedin" href="#" target="_blank" rel="noopener"><span>in</span> LinkedIn</a>
        <a class="share-btn twitter"  id="share-twitter"  href="#" target="_blank" rel="noopener"><span>𝕏</span> Twitter / X</a>
        <button class="share-btn copy" id="share-copy"><span>🔗</span> Kopier link</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
